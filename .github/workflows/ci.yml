name: CI & Release Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --verbose
      - name: Build release binary
        run: cargo build --release --verbose
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gw2-auto-click-windows-x64
          path: target/release/gw2-auto-click.exe
      - name: Package & Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path dist/gw2-auto-click | Out-Null
          Copy-Item target/release/gw2-auto-click.exe dist/gw2-auto-click/
          Copy-Item config.example.json, README.md, LICENSE dist/gw2-auto-click/
          Compress-Archive -Path dist/gw2-auto-click/* -DestinationPath dist/gw2-auto-click-windows-x64.zip -Force
          gh release create "$env:GITHUB_REF_NAME" `
            target/release/gw2-auto-click.exe `
            dist/gw2-auto-click-windows-x64.zip `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes
